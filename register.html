<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Citizen Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
<h2>&#127969; CivicConnect</h2>
<div>
<a href="index.html">Home</a>
<a href="login.html">Login</a>
</div>
</nav>

<div class="form-container">
<h2>Citizen Registration</h2>

<form id="regForm" onsubmit="return handleRegister(event)">
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone Number" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Register</button>
</form>

<div id="msg" style="color:green; text-align:center; margin-top:15px; display:none;">
Registration successful! <a href="login.html">Click here to login</a>
</div>

<p style="text-align:center; margin-top:15px;">
Already registered? <a href="login.html">Login</a>
</p>
</div>

<script>
function handleRegister(e) {
    e.preventDefault();
    document.getElementById("msg").style.display = "block";
    return false;
}
</script>
</body>
</html>
